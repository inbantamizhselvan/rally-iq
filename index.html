<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Rally IQ</title>
<meta name="description" content="A realistic tennis strategy game: pick the right shot, beat smart opponents, learn real tactics.">
<meta name="theme-color" content="#0A1224">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rally IQ">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#0A1224;--card:#131D38;--card2:#1A2648;--line:#283766;--text:#F1F5FF;--muted:#93A0C6;--ball:#DCFF4A;--win:#3BE38A;--loss:#FF5C72;--gold:#FFC94A;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;
  font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
#screen{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--st) + 18px) 16px calc(var(--sb) + 24px)}
#screen .in{max-width:560px;margin:0 auto}
#game{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:var(--st)}
#game[hidden],#screen[hidden],#modal[hidden]{display:none}
#hud{flex:none;padding:6px 10px 4px}
#stage{flex:1;position:relative;min-height:200px;overflow:hidden}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
#panel{flex:none;background:linear-gradient(180deg,#0E1730,#0A1224);border-top:1px solid var(--line);padding:10px 12px calc(var(--sb) + 10px);min-height:120px}
#toast{position:absolute;left:50%;top:16px;transform:translateX(-50%);pointer-events:none;font-weight:900;font-size:22px;letter-spacing:1px;
  text-shadow:0 2px 12px rgba(0,0,0,.6);opacity:0;transition:opacity .2s;white-space:nowrap}
#toast.on{opacity:1}
.sb{display:grid;grid-template-columns:14px 1fr auto auto;gap:6px;align-items:center;background:#060B18;border:1px solid var(--line);border-radius:12px;padding:4px 10px;font-variant-numeric:tabular-nums}
.sb .nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.sb .g{color:var(--muted);font-weight:800;min-width:40px;text-align:right;letter-spacing:4px}
.sb .p{min-width:44px;text-align:center;font-weight:900;color:var(--ball);font-size:18px;background:var(--card);border-radius:7px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ball);box-shadow:0 0 8px var(--ball)}
.hudrow{display:flex;gap:8px;align-items:center}
.hudrow .sb{flex:1}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:18px;flex:none}
.tagline{text-align:center;font-weight:900;font-size:12px;letter-spacing:1.5px;margin-top:4px;min-height:16px;color:var(--gold)}
.tagline.bad{color:#FF8A9B}.tagline.good{color:var(--win)}
.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:8px 11px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:13px;font-weight:800}
.chip.on{background:var(--ball);color:#111;border-color:var(--ball)}
.chip.dim{opacity:.35}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.shot{min-height:44px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:800;font-size:14px;line-height:1.1;padding:4px}
.shot small{display:block;font-size:10px;font-weight:600;color:var(--muted)}
.shot.on{background:var(--ball);color:#111;border-color:var(--ball)}.shot.on small{color:#333}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:14px;font-weight:800;background:var(--card2);border:1px solid var(--line);width:100%}
.btn:active,.shot:active,.chip:active{transform:scale(.97)}
.btn.primary{background:var(--ball);color:#10140A;border:0}
.hit{min-height:56px;font-size:20px;letter-spacing:1px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:12px;font-weight:800}
.risk{font-weight:900;font-variant-numeric:tabular-nums}
.lbl{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin:8px 0 5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
h1{margin:0;font-size:30px;letter-spacing:-.5px}
h2{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:22px 4px 10px}
h3{margin:0 0 6px}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:11px}
.logo{font-weight:900;font-size:44px;letter-spacing:-1px;line-height:1}
.logo b{color:var(--ball)}
.hero{text-align:center;padding:26px 16px;background:radial-gradient(120% 120% at 50% 0%,#24407a 0%,#131D38 60%);border-color:#2f4c8a}
.opp{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:10px;width:100%;text-align:left}
.opp.locked{opacity:.45}
.av{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-weight:900;font-size:20px;color:#0A1224;flex:none}
.stars{color:var(--gold);letter-spacing:2px;font-size:14px}
ul.t{margin:0;padding-left:18px}ul.t li{margin:6px 0}
.result{font-size:26px;font-weight:900;letter-spacing:.5px}
.coach{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:14px}
.coach.good{border-color:#1d7a4a;background:rgba(59,227,138,.08)}
.coach.bad{border-color:#8a2234;background:rgba(255,92,114,.08)}
#modal{position:absolute;inset:0;z-index:20;background:rgba(5,8,18,.88);display:flex;align-items:flex-end;justify-content:center;padding:16px 16px calc(var(--sb) + 16px)}
#modal .sheet{width:100%;max-width:520px;max-height:100%;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}.kv:last-child{border-bottom:0}
.grade{font-size:64px;font-weight:900;line-height:1}
.seg{display:flex;background:#0A1224;border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:40px;border-radius:9px;font-weight:800;color:var(--muted);font-size:14px}
.seg button.on{background:var(--card2);color:var(--text)}
input[type=text]{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:#0A1224;padding:10px 12px;font-size:16px;outline:none}
</style>
</head>
<body>
<div id="screen"></div>
<div id="game" hidden>
  <div id="hud"></div>
  <div id="stage"><canvas id="cv"></canvas><div id="toast"></div></div>
  <div id="panel"></div>
</div>
<div id="modal" hidden></div>
<script src="scoring.js"></script>
<script src="sim.js"></script>
<script src="roster.js"></script>
<script src="game.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
